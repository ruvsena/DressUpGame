
name: CSS Important Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-css:
    name: Check-CSS-Important
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files_ignore: |
            "**/dist/**"
            "**/ext/**"
            "**/*.min.css"

      - name: Check for !important
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const core = require('@actions/core');
            const files = `${{ steps.changed.outputs.all_changed_files }}`.split(' ');
            let found = false;

            for (const file of files) {
              if (file.endsWith('.css') && fs.existsSync(file)) {
                const content = fs.readFileSync(file, 'utf8');
                if (content.includes('!important')) {
                  found = true;
                  break;
                }
              }
            }

            core.setOutput('needs_cleanup', found ? 'true' : 'false');

      - name: Comment on PR
        if: steps.check.outputs.needs_cleanup == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: "🚨 **CSS files contain `!important`**"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if !important found
        if: steps.check.outputs.needs_cleanup == 'true'
        run: |
          echo "❌ Found '!important' in CSS files. Please remove them."
          exit 1
