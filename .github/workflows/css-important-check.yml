name: CSS-Important-Check

on: pull_request_target

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: tj-actions/changed-files@v44
        id: changed
        with:
          files_ignore: |
            **/dist/**
            **/*.min.css

      - name: Detect !important
        id: important
        run: |
          echo "${{ steps.changed.outputs.all_changed_files }}" | xargs grep -Hn "!important" || true

      - name: Comment and Fail if found
        if: always() && contains(steps.important.outputs.stdout, '!important')
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚨 **Found '!important' in CSS files**
            Please remove them before merging.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if !important exists
        if: contains(steps.important.outputs.stdout, '!important')
        run: exit 1
